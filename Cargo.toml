[package]
name = "lxp"
version = "0.2.0"
authors = ["simsys <winfried.simon@gmail.com>"]
edition = "2018"
description = "Command-line client for the LetterXpress print and mail service"
license = "MIT"
repository = "https://github.com/mbr/lxpservice-rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env", "cargo"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = { version = "0.4", features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.53", features = ["full"] }
base64 = "0.23"
md5 = "0.8"
futures = "0.3"
notify = "8.2"
dirs = "7.0"
toml = "1.1"

[profile.release]
opt-level = 'z'  # Optimize for size.
lto = true
codegen-units = 1