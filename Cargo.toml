[package]
name = "lxp"
version = "0.2.0"
authors = ["simsys <winfried.simon@gmail.com>"]
edition = "2024"
description = "Command-line client for the LetterXpress print and mail service"
license = "MIT"
repository = "https://github.com/mbr/lxpservice-rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
base64 = "0.23"
md5 = "0.8"
notify = "8.2"
dirs = "7.0"
toml = "1.1"
thiserror = "2.0"
sec = { version = "1.1", features = ["serialize", "deserialize"] }
tempfile = "3.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 'z'  # Optimize for size.
lto = true
codegen-units = 1